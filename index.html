  try{ return new URLSearchParams(location.search).get('from') || 'direct'; }catch(e){ return 'direct'; }
})();

/* 利用回数の記録（メールアドレスは送りません／失敗しても画面には影響しません） */
function usePing(action, keywords, schools){
  try{
    if(!GAS_URL) return;
    fetch(GAS_URL, {method:'POST', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({type:'count', app:'高校診断(通年)', action:action, day:'通年',
        keywords:keywords||[], schools:schools||[], vid:visitorId(), from:FROM})}).catch(function(){});
  }catch(e){}
}

/* ---------- キーワード選択 ---------- */
function buildGroups(){
  var html = '';
  GROUPS.forEach(function(g){
    html += '<div class="gcard"><h2>'+g.g+'</h2><div class="kws">';
    g.ks.forEach(function(i){
      html += '<button type="button" class="kw" data-i="'+i+'" onclick="toggleKw(this)">'+KW[i].l+'<span class="c">('+KW[i].c+')</span></button>';
    });
    html += '</div></div>';
  });
  document.getElementById('groups').innerHTML = html;
}
function toggleKw(el){
  var i = parseInt(el.dataset.i,10), p = sel.indexOf(i);
  if(p>=0){ sel.splice(p,1); } else { if(sel.length>=PICK_N) return; sel.push(i); }
  refresh();
}
function refresh(){
  var full = sel.length>=PICK_N, els = document.querySelectorAll('.kw');
  for(var n=0;n<els.length;n++){
    var el=els[n], i=parseInt(el.dataset.i,10), on=sel.indexOf(i)>=0;
    el.className = 'kw'+(on?' on':'')+((full&&!on)?' dim':'');
  }
  var pk=document.getElementById('picked');
  if(sel.length===0){ pk.innerHTML='<span class="pempty">えらんだキーワードがここに表示されます</span>'; }
  else{ pk.innerHTML = sel.map(function(i){return '<button class="pchip" onclick="unpick('+i+')">'+KW[i].l+'<span class="x">×</span></button>';}).join(''); }
  var go=document.getElementById('go');
  go.disabled = !full;
  go.textContent = full ? 'この5つで診断する' : 'あと'+(PICK_N-sel.length)+'つ選んでください';
}
function unpick(i){ var p=sel.indexOf(i); if(p>=0){ sel.splice(p,1); refresh(); } }

/* ---------- 診断 ---------- */
function scoreAll(){
  var N = SCHOOLS.length;
  return SCHOOLS.map(function(s,idx){
    var hit=[], miss=[], rare=0, w=0;
    sel.forEach(function(i){
      if(s.k.indexOf(i)>=0){ hit.push(i); rare += 1 - (KW[i].c / N); w += KW[i].rg ? 100 : 1; }
      else { miss.push(i); }
    });
    return {idx:idx, s:s, hit:hit, miss:miss, score:hit.length, w:w, rare:rare, os:(s.os&&s.os.length)?1:0};
  });
}

function pick(cands){
  var out=[], prefs={};
  for(var i=0;i<cands.length && out.length<PICK_N;i++){
    var c=cands[i];
    c.adj = c.w + (c.os?OS_BONUS:0) - (prefs[c.s.p]||0)*PREF_PENALTY;
  }
  // 調整点で並べ直しながら1校ずつ確定する
  var pool = cands.slice();
  while(out.length<PICK_N && pool.length){
    var best=-1, bestVal=-1e9;
    for(var j=0;j<pool.length;j++){
      var v = pool[j].w + (pool[j].os?OS_BONUS:0) - (prefs[pool[j].s.p]||0)*PREF_PENALTY + pool[j].rare*0.01;
      if(v>bestVal){ bestVal=v; best=j; }
    }
    var chosen = pool.splice(best,1)[0];
    prefs[chosen.s.p] = (prefs[chosen.s.p]||0)+1;
    out.push(chosen);
  }
  return out;
}

function diagnose(){ shownIdx=[]; run(false); }
function another(){ run(true); }

function run(excludeShown){
  var scored = scoreAll();
  if(excludeShown){
    var rest = scored.filter(function(x){ return shownIdx.indexOf(x.idx)<0; });
    if(rest.length>=PICK_N){ scored = rest; } else { shownIdx=[]; }
  }
  scored.sort(function(a,b){
    if(b.w!==a.w) return b.w-a.w;
    if(b.os!==a.os) return b.os-a.os;
    if(Math.abs(b.rare-a.rare)>1e-9) return b.rare-a.rare;
    return a.idx-b.idx;
  });
  var list = pick(scored.slice(0, 60));
  list.forEach(function(it){ if(shownIdx.indexOf(it.idx)<0) shownIdx.push(it.idx); });
  lastPlan = list;
  render(list);
  usePing(excludeShown ? '別の5校' : '診断',
    sel.map(function(i){ return KW[i].l; }),
    list.map(function(it){ return it.s.n; }));
  window.scrollTo({top:0,behavior:'smooth'});
}

var LABELS={5:'ぴったり！',4:'かなり合う',3:'まあまあ合う',2:'すこし合う',1:'参考まで',0:'参考まで'};
function stars(n){ return '★'.repeat(n)+'☆'.repeat(PICK_N-n); }
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function schoolUrl(s){ return 'https://c-mirai.jp/schools/'+s.id; }
function osText(o){ return o.d + (o.t ? ' '+o.t+'〜' : ''); }

function render(list){
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('pickbar').classList.add('hidden');
  var r=document.getElementById('results');
  r.classList.remove('hidden');
  var html = '<div class="result-head"><h2>あなたにおすすめの5校</h2>'
    + '<div class="cond">'+sel.map(function(i){ return '<span class="chip">'+KW[i].l+'</span>'; }).join('')+'</div>'
    + '<div class="note">気になる学校は「学校ページを見る」から、オープンスクール（現地訪問）の申し込みや資料をご確認ください。</div></div>';
  list.forEach(function(it, n){
    var s=it.s;
    html += '<div class="card"><div class="rank">'+(n+1)+'</div>'
      + '<h3>'+esc(s.n)+'</h3><div class="pref">'+esc(s.p)+(s.r?'（'+esc(s.r)+'）':'')+'</div>'
      + '<div class="stars">'+stars(it.score)+'<span class="lab">'+LABELS[it.score]+'（5つ中'+it.score+'つ一致）</span></div>'
      + (s.d?'<p class="pr">'+esc(s.d)+'</p>':'')
      + '<div class="chips">'
      + it.hit.map(function(i){ return '<span class="chip">✓ '+KW[i].l+'</span>'; }).join('')
      + it.miss.map(function(i){ return '<span class="chip no">'+KW[i].l+'</span>'; }).join('')
      + '</div>';
    if(s.os && s.os.length){
      html += '<div class="os"><div class="ttl">📅 オープンスクール（現地訪問）の予定</div>'
        + s.os.slice(0,3).map(function(o){
            return '<div class="osrow"><div class="osday">'+esc(osText(o))+'</div>'
              + (o.n?'<div class="osname">'+esc(o.n)+'</div>':'')
              + (o.u?'<a class="osbtn" href="'+o.u+'" target="_blank" rel="noopener">詳細を確認する</a>':'')
              + '</div>';
          }).join('')
        + (s.os.length>3 ? '<div class="more">ほか'+(s.os.length-3)+'件の開催予定があります（学校ページからご確認ください）</div>' : '')
        + '</div>';
    } else {
      html += '<div class="os none"><div class="ttl">📅 オープンスクール（現地訪問）の予定</div>'
        + '<div style="font-size:14px">現在は公開されていません。見学を希望する場合は学校へお問い合わせください。</div>'
        + (s.tel ? '<div class="tel">📞 <a href="tel:'+esc(s.tel)+'" style="color:inherit">'+esc(s.tel)+'</a></div>' : '')
        + (s.ml ? '<div class="tel">✉️ <a href="mailto:'+esc(s.ml)+'" style="color:inherit">'+esc(s.ml)+'</a></div>' : '')
        + '</div>';
    }
    html += '<a class="go2" href="'+schoolUrl(s)+'" target="_blank" rel="noopener">学校ページを見る</a></div>';
  });
  html += '<div class="actions"><button onclick="another()">🔄 別の5校を見る</button><button onclick="restart()">↩ キーワードを選びなおす</button></div>'
    + '<div class="mailbox"><h3>📩 この結果をメールで受け取る</h3>'
    + '<p>あとからゆっくり見られるよう、5校の情報とオープンスクールの予定、学校ページのリンクをお送りします。</p>'
    + '<input type="email" id="email" placeholder="メールアドレスを入力" autocomplete="email">'
    + '<button id="sendbtn" onclick="sendMail()">この内容をメールで送る</button>'
    + '<div class="mstat" id="mstat"></div></div>';
  r.innerHTML = html;
}
function restart(){
  document.getElementById('results').classList.add('hidden');
  document.getElementById('step1').classList.remove('hidden');
  document.getElementById('pickbar').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- メール送信 ---------- */
function sendMail(){
  var em=(document.getElementById('email').value||'').trim();
  var st=document.getElementById('mstat');
  st.className='mstat';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ st.className='mstat ng'; st.textContent='メールアドレスの形式をご確認ください。'; return; }
  if(!GAS_URL){ st.className='mstat ng'; st.textContent='送信先が未設定です（管理者：GASのURLを設定してください）。'; return; }
  var items = lastPlan.map(function(it){
    var s=it.s;
    return { n: s.n+'（'+s.p+'／マッチ度 5つ中'+it.score+'つ一致）',
             os: (s.os||[]).slice(0,3).map(osText).join(' ／ ') || (function(){
                   var c=[s.tel,s.ml].filter(Boolean).join(' / ');
                   return c ? 'オープンスクールの予定は未公開（お問い合わせ：'+c+'）' : 'オープンスクールの予定は未公開';
                 })(),
             u: schoolUrl(s) };
  });
  var keywords = sel.map(function(i){ return KW[i].l; });
  var btn=document.getElementById('sendbtn');
  btn.disabled=true; st.textContent='送信中…';
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({email:em,keywords:keywords,items:items})})
   .then(function(r){ return r.json(); })
   .then(function(j){
      if(j && j.ok){ showComplete(); }
      else { btn.disabled=false; st.className='mstat ng'; st.textContent='送信できませんでした：'+((j&&j.error)||'不明なエラー'); }
   })
   .catch(function(){ btn.disabled=false; st.className='mstat ng'; st.textContent='送信できませんでした。通信環境をご確認ください。'; });
}
function showComplete(){
  document.getElementById('results').innerHTML='<div class="complete"><div class="ic">✅</div><h2>送信しました</h2>'
   +'<p>ご入力いただいたメールアドレスに<br>診断結果をお送りしました。<br>数分たっても届かない場合は迷惑メールフォルダもご確認ください。</p>'
   +'<button onclick="location.reload()">もう一度診断する</button></div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

buildGroups(); refresh();
try{ if(!sessionStorage.getItem('used_shindan_year')){ sessionStorage.setItem('used_shindan_year','1'); usePing('起動',[],[]); } }catch(e){}
</script>
